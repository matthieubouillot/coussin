name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valeurs factices propres à la CI : aucun secret réel n'est nécessaire pour les tests.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coussin_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/coussin_test
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  ADMIN_PATH: gestion-ci-0123456789
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  qualite:
    name: Lint, types, tests unitaires, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Audit des dépendances
        run: pnpm audit --audit-level=moderate

  e2e:
    name: Migrations + tests E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coussin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Les migrations s'appliquent sur une base vierge
        run: pnpm db:deploy
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
