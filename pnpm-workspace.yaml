# pnpm 11 bloque les scripts d'installation par défaut : on n'autorise que ceux dont on a besoin.
allowBuilds:
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  "@sentry/cli": true
minimumReleaseAgeExclude:
  - "@sentry/browser-utils@11.2.0"
  - "@sentry/browser@11.2.0"
  - "@sentry/bundler-plugins@11.2.0"
  - "@sentry/core@11.2.0"
  - "@sentry/feedback@11.2.0"
  - "@sentry/nextjs@11.2.0"
  - "@sentry/node@11.2.0"
  - "@sentry/opentelemetry@11.2.0"
  - "@sentry/react@11.2.0"
  - "@sentry/replay-canvas@11.2.0"
  - "@sentry/replay@11.2.0"
  - "@sentry/server-runtime-injection@11.2.0"
  - "@sentry/server-utils@11.2.0"
  - "@sentry/vercel-edge@11.2.0"

# Correctifs de sécurité de dépendances transitives du CLI Prisma (pnpm audit).
# À retirer quand Prisma embarquera lui-même ces versions.
overrides:
  mysql2: ">=3.23.1"
  deepmerge-ts: ">=8.0.0"
